<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#060913" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // 初回描画前にテーマを確定させ、ダーク→ライトのちらつきを防ぐ (useTheme.ts と同じ規則)
      (function () {
        var pref = 'system';
        try {
          var saved = localStorage.getItem('theme');
          if (saved === 'light' || saved === 'dark') pref = saved;
        } catch (e) {}
        var dark = pref === 'dark' || (pref === 'system' && !window.matchMedia('(prefers-color-scheme: light)').matches);
        var theme = dark ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', theme);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#060913' : '#f6f7fb');
      })();
    </script>
    <title>Sora | Code Lab</title>
